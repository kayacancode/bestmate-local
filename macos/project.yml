name: BestmateLocal
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BestmateLocal:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bestmate.local.opensource
        PRODUCT_NAME: BestmateLocal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bestmate Local
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  BestmateLocalTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: BestmateLocal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BestmateLocal:
    build:
      targets:
        BestmateLocal: all
    test:
      targets: [BestmateLocalTests]
